#     # GPU Accelerator support. Pick the ones that are supported by your extension.
#     "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = ["transformers>=4.49.0", "huggingface_hub>=0.23.1", "pillow", "bitsandbytes"]

[project.urls]
Repository = "https://github.com/TTPlanetPig/Comfyui_Object_Detect_QWen_VL"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/TTPlanetPig/Comfyui_Object_Detect_QWen_VL/wiki"
"Bug Tracker" = "https://github.com/TTPlanetPig/Comfyui_Object_Detect_QWen_VL/issues"

[tool.comfy]
PublisherId = ""
DisplayName = "Comfyui_Object_Detect_QWen_VL"
Icon = ""
includes = [] 
